# Installed by tproxy-keys.
#
# The stock unit passes one client secret through -S ${MTPROXY_SECRET}, and
# systemd expands the ${VAR} form to exactly one argument. Serving several keys
# from one MTProxy needs one -S per secret, so this drop-in switches to the
# whitespace-splitting $VAR form and takes the list from a file that tproxy-keys
# rewrites on every change.
[Service]
EnvironmentFile=/etc/mtproxy/mtproxy-keys.env
ExecStart=
ExecStart=/opt/MTProxy/objs/bin/mtproto-proxy -u mtproxy -p 8888 -H 2398 $MTPROXY_SECRET_ARGS --aes-pwd /etc/mtproxy/proxy-secret /etc/mtproxy/proxy-multi.conf -M ${MTPROXY_WORKERS} -C ${MTPROXY_MAX_CONNECTIONS}
